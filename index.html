<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paint</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar" aria-label="Paint toolbar">
    <div class="topbar-section brand-group">
      <h1 class="app-title">Paint</h1>
      <span class="sep"></span>
      <div class="brush-indicator" title="Current brush type">
        <canvas id="brushPreview" width="28" height="28" aria-hidden="true"></canvas>
        <div class="brush-meta">
          <span class="micro-label">BRUSH</span>
          <span class="brush-type-name" id="brushTypeName">Soft round</span>
        </div>
      </div>
    </div>

    <span class="sep"></span>

    <div class="topbar-section slider-group">
      <label class="micro-label" for="brushSize">SIZE</label>
      <input type="range" id="brushSize" min="1" max="280" step="0.5" value="24" />
      <span class="readout" id="brushSizeValue">24 px</span>
    </div>

    <span class="sep"></span>

    <div class="topbar-section slider-group">
      <label class="micro-label" for="brushOpacity">OPACITY</label>
      <input type="range" id="brushOpacity" min="5" max="100" step="1" value="75" />
      <span class="readout" id="brushOpacityValue">75%</span>
    </div>

    <span class="sep"></span>

    <div class="topbar-section color-group">
      <label class="swatch-wrap" title="Current brush color">
        <span class="color-swatch" id="colorSwatch"></span>
        <input type="color" id="colorPicker" value="#c89e64" />
      </label>
      <div class="color-readout">
        <span class="color-hex" id="colorHex">#C89E64</span>
        <span class="color-rgb" id="colorRgb">R 200 · G 158 · B 100</span>
      </div>
    </div>

    <div class="topbar-spacer"></div>

    <div class="topbar-section controls-group">
      <button type="button" class="ctrl-btn" id="btnPlayPause" title="Pause or resume painting">Pause</button>
      <button type="button" class="ctrl-btn" id="btnFinish" title="Jump to finished painting">Finish</button>
      <button type="button" class="ctrl-btn" id="btnReset" title="Clear canvas and repaint from blank">Restart</button>
    </div>

    <span class="sep"></span>

    <div class="topbar-section stage-header" aria-live="polite">
      <span class="stage-step-count" id="topStageCount">STAGE 1 OF 9</span>
      <span class="stage-step-name" id="topStageName">Underpainting</span>
    </div>
  </header>

  <div class="app-body">
    <nav class="tool-rail" aria-label="Tools">
      <button type="button" class="rail-btn active" data-tool="brush" title="Brush" aria-pressed="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18.37 2.63a2.12 2.12 0 0 1 3 3L14 13l-4 1 1-4Z" />
          <path d="M9 14.5A3.5 3.5 0 0 0 5.5 18c0 1.4-1 2.5-2.5 2.5 1.8 1.2 4.8 1.3 6.8-.5a3.5 3.5 0 0 0 .7-4.5" />
        </svg>
      </button>
      <button type="button" class="rail-btn" data-tool="pencil" title="Pencil" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
          <path d="m15 5 4 4" />
        </svg>
      </button>
      <button type="button" class="rail-btn" data-tool="eraser" title="Eraser" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m7 21-4.3-4.3a2.4 2.4 0 0 1 0-3.4l9.6-9.6a2.4 2.4 0 0 1 3.4 0l5.6 5.6a2.4 2.4 0 0 1 0 3.4L13 21" />
          <path d="M22 21H7" />
          <path d="m5 11 9 9" />
        </svg>
      </button>
      <button type="button" class="rail-btn" data-tool="fill" title="Fill" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2a2 2 0 0 0 2.8 0L19 11Z" />
          <path d="m5 2 5 5" />
          <path d="M2 13h15" />
          <path d="M20 15.5c1.1 1.4 1.8 2.4 1.8 3.3a1.8 1.8 0 0 1-3.6 0c0-.9.7-1.9 1.8-3.3Z" />
        </svg>
      </button>
      <button type="button" class="rail-btn" data-tool="zoom" title="Zoom fit / 135%" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m21 21-4.3-4.3" />
          <path d="M11 8v6" />
          <path d="M8 11h6" />
        </svg>
      </button>
    </nav>

    <main class="canvas-stage" id="canvasStage" aria-label="Painting canvas">
      <div class="canvas-frame" id="canvasFrame">
        <canvas id="paintCanvas" width="1280" height="1932"></canvas>
        <canvas id="overlayCanvas" width="1280" height="1932" aria-hidden="true"></canvas>
      </div>
    </main>

    <aside class="right-sidebar" aria-label="Reference, stats, stages and palette">
      <section class="sidebar-card reference-section" aria-label="Reference">
        <div class="section-header">
          <span class="section-title">REFERENCE</span>
        </div>
        <div class="reference-center">
          <div class="reference-frame" id="referenceFrame">
            <img id="referenceImage" src="reference.png" alt="Reference portrait" />
            <div class="ref-cursor" id="refCursor" aria-hidden="true"></div>
          </div>
        </div>
      </section>

      <section class="stats-grid" aria-label="Live painting stats">
        <div class="stat-card">
          <div class="stat-value" id="statStrokes">0</div>
          <div class="stat-label">STROKES</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statColors">0</div>
          <div class="stat-label">COLORS MIXED</div>
        </div>
      </section>

      <section class="sidebar-card stages-section" aria-label="Painting stages">
        <div class="section-header">
          <span class="section-title">STAGES</span>
        </div>
        <ol class="stages-list" id="stagesList"></ol>
      </section>

      <section class="sidebar-card palette-section" aria-label="Cumulative color palette">
        <div class="section-header">
          <span class="section-title">PALETTE</span>
          <span class="palette-meta" id="paletteMeta">0 colors · Underpainting</span>
        </div>
        <div class="palette-scroll">
          <div class="palette-grid" id="paletteGrid"></div>
        </div>
      </section>
    </aside>
  </div>

  <script src="painting-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
